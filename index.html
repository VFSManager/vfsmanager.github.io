<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chrollo Lucilfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --void:    #050508;
  --deep:    #0C0C14;
  --mid:     #13131F;
  --gold:    #C9A84C;
  --gold-dim:#7A6128;
  --gold-pale:#E8D5A3;
  --crimson: #7A1525;
  --scarlet: #A81D33;
  --silver:  #D4D4E0;
  --silver-dim: #6A6A7A;
  --ghost:   #1E1E2E;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--void);
  color: var(--silver);
}

/* ── CANVAS ── */
.canvas {
  position: relative;
  width: 100vw; height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

/* ── DEEP ATMOSPHERE ── */
.atmosphere {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* Large deep violet nebula center */
.atmosphere::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -52%);
  width: 70vw; height: 70vh;
  background: radial-gradient(ellipse at center,
    rgba(30,15,60,0.55) 0%,
    rgba(18,8,35,0.30) 35%,
    rgba(90,15,30,0.08) 60%,
    transparent 75%);
  border-radius: 50%;
}

/* Gold corona rim at bottom */
.atmosphere::after {
  content: '';
  position: absolute;
  left: 50%; bottom: -20vh;
  transform: translateX(-50%);
  width: 120vw; height: 60vh;
  background: radial-gradient(ellipse at center top,
    rgba(201,168,76,0.06) 0%,
    transparent 60%);
  border-radius: 50%;
}

/* ── GRAIN OVERLAY ── */
.grain {
  position: absolute; inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.018;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px;
}

/* ── TOP HEADER ── */
.header {
  position: relative;
  z-index: 20;
  width: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 36px 52px 0;
}

/* Gold top hairline */
.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--gold-dim) 20%,
    var(--gold) 50%,
    var(--gold-dim) 80%,
    transparent 100%);
  opacity: 0.6;
}

.ident {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.ident-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  font-weight: 400;
  letter-spacing: 0.45em;
  color: var(--gold-dim);
  text-transform: uppercase;
}

.ident-name {
  font-family: 'Cinzel Decorative', serif;
  font-size: 18px;
  font-weight: 400;
  color: var(--gold-pale);
  letter-spacing: 0.08em;
  line-height: 1.2;
  /* subtle gold text glow */
  text-shadow: 0 0 40px rgba(201,168,76,0.35), 0 0 80px rgba(201,168,76,0.12);
}

.ident-sub {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px;
  font-weight: 300;
  color: var(--silver-dim);
  letter-spacing: 0.12em;
  margin-top: 2px;
}

/* Thin gold ornament line left of name */
.ident-line {
  width: 28px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold));
  margin-bottom: 2px;
  opacity: 0.5;
}

/* Right crest mark */
.crest {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  padding-top: 2px;
}

.crest-num {
  font-family: 'Cinzel Decorative', serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--crimson);
  letter-spacing: 0.3em;
  opacity: 0.5;
}

.crest-rule {
  width: 40px; height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
  opacity: 0.35;
}

/* ── SIGIL ZONE ── */
.sigil-zone {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  flex: 1;
  width: 100%;
  padding-top: 0;
}

.sigil-wrap {
  position: relative;
  width: min(52vh, 480px);
  height: min(52vh, 480px);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Outermost ornamental ring — very slow gold rotation */
.ring-gold {
  position: absolute; inset: 0;
  animation: rot 120s linear infinite;
  opacity: 0.22;
}

/* Mid ring — crimson dashes, reverse */
.ring-mid {
  position: absolute; inset: 8%;
  animation: rot 80s linear infinite reverse;
  opacity: 0.14;
}

/* Inner halo — near still */
.ring-inner {
  position: absolute; inset: 17%;
  animation: rot 200s linear infinite;
  opacity: 0.10;
}

@keyframes rot { to { transform: rotate(360deg); } }

/* Spider */
.spider-svg {
  position: relative; z-index: 5;
  width: min(30vh, 260px);
  height: min(30vh, 260px);
  filter:
    drop-shadow(0 0 18px rgba(201,168,76,0.20))
    drop-shadow(0 0 50px rgba(168,29,51,0.40))
    drop-shadow(0 0 100px rgba(168,29,51,0.15));
  animation: breathe 7s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: scale(1);    opacity: 0.82; }
  50%       { transform: scale(1.04); opacity: 1;    }
}

/* Arc text orbiting */
.arc-text {
  position: absolute;
  inset: -6%;
  z-index: 3;
  opacity: 0.18;
  animation: rot 240s linear infinite reverse;
}

/* ── FOOTER ORNAMENT ── */
.footer {
  position: relative;
  z-index: 20;
  width: 100%;
  padding: 0 52px 32px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.footer-ornament {
  display: flex;
  align-items: center;
  gap: 16px;
  opacity: 0.28;
}

.footer-rule {
  height: 1px;
  width: 80px;
  background: linear-gradient(90deg, transparent, var(--gold));
}

.footer-rule.rev {
  background: linear-gradient(90deg, var(--gold), transparent);
}

.footer-diamond {
  width: 5px; height: 5px;
  background: var(--gold);
  transform: rotate(45deg);
  opacity: 0.8;
}

/* ── CORNER MARKS ── */
.corner {
  position: absolute;
  width: 22px; height: 22px;
  z-index: 20;
  opacity: 0.35;
}
.corner--tl { top: 18px; left: 18px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.corner--tr { top: 18px; right: 18px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
.corner--bl { bottom: 18px; left: 18px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.corner--br { bottom: 18px; right: 18px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

/* corner inner dots */
.corner::after {
  content: '';
  position: absolute;
  width: 3px; height: 3px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0.7;
}
.corner--tl::after { top: -1px; left: -1px; }
.corner--tr::after { top: -1px; right: -1px; }
.corner--bl::after { bottom: -1px; left: -1px; }
.corner--br::after { bottom: -1px; right: -1px; }

/* ── BOTTOM GOLD HAIRLINE ── */
.line-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--gold-dim) 25%,
    var(--gold) 50%,
    var(--gold-dim) 75%,
    transparent 100%);
  opacity: 0.35;
  z-index: 20;
}
</style>
</head>
<body>
<div class="canvas">

  <div class="atmosphere"></div>
  <div class="grain"></div>
  <div class="line-bottom"></div>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="ident">
      <div class="ident-eyebrow">Phantom Troupe</div>
      <div class="ident-line"></div>
      <div class="ident-name">Chrollo Lucilfer</div>
      <div class="ident-sub">Leader · The Spider's Head</div>
    </div>
    <div class="crest">
      <div class="crest-num">◆ &nbsp; I</div>
      <div class="crest-rule"></div>
    </div>
  </div>

  <!-- SIGIL -->
  <div class="sigil-zone">
    <div class="sigil-wrap">

      <!-- Outer gold ornamental ring -->
      <svg class="ring-gold" viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <path id="rp-outer" d="M240,18 A222,222 0 1,1 239.99,18"/>
        </defs>
        <circle cx="240" cy="240" r="232" stroke="#C9A84C" stroke-width="0.6" stroke-dasharray="3 9"/>
        <circle cx="240" cy="240" r="222" stroke="#C9A84C" stroke-width="0.3" stroke-dasharray="1 24"/>
        <text font-family="Cinzel, serif" font-size="9.5" fill="#C9A84C" letter-spacing="9.5">
          <textPath href="#rp-outer" startOffset="0%">GENEI RYODAN · PHANTOM TROUPE · THE SPIDER · GENEI RYODAN · PHANTOM TROUPE · </textPath>
        </text>
        <!-- Tick marks at 45° intervals -->
        <line x1="240" y1="8"  x2="240" y2="20"  stroke="#C9A84C" stroke-width="1" transform="rotate(0   240 240)" opacity="0.8"/>
        <line x1="240" y1="8"  x2="240" y2="20"  stroke="#C9A84C" stroke-width="1" transform="rotate(45  240 240)" opacity="0.5"/>
        <line x1="240" y1="8"  x2="240" y2="20"  stroke="#C9A84C" stroke-width="1" transform="rotate(90  240 240)" opacity="0.8"/>
        <line x1="240" y1="8"  x2="240" y2="20"  stroke="#C9A84C" stroke-width="1" transform="rotate(135 240 240)" opacity="0.5"/>
        <line x1="240" y1="8"  x2="240" y2="20"  stroke="#C9A84C" stroke-width="1" transform="rotate(180 240 240)" opacity="0.8"/>
        <line x1="240" y1="8"  x2="240" y2="20"  stroke="#C9A84C" stroke-width="1" transform="rotate(225 240 240)" opacity="0.5"/>
        <line x1="240" y1="8"  x2="240" y2="20"  stroke="#C9A84C" stroke-width="1" transform="rotate(270 240 240)" opacity="0.8"/>
        <line x1="240" y1="8"  x2="240" y2="20"  stroke="#C9A84C" stroke-width="1" transform="rotate(315 240 240)" opacity="0.5"/>
        <!-- Diamond ornaments at cardinal points -->
        <polygon points="240,4 244,11 240,18 236,11" fill="#C9A84C" opacity="0.7"/>
        <polygon points="240,4 244,11 240,18 236,11" fill="#C9A84C" opacity="0.7" transform="rotate(90  240 240)"/>
        <polygon points="240,4 244,11 240,18 236,11" fill="#C9A84C" opacity="0.7" transform="rotate(180 240 240)"/>
        <polygon points="240,4 244,11 240,18 236,11" fill="#C9A84C" opacity="0.7" transform="rotate(270 240 240)"/>
      </svg>

      <!-- Mid crimson ring -->
      <svg class="ring-mid" viewBox="0 0 380 380" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="190" cy="190" r="186" stroke="#7A1525" stroke-width="0.5" stroke-dasharray="6 12"/>
        <circle cx="190" cy="190" r="178" stroke="#A81D33" stroke-width="0.3" stroke-dasharray="1 18"/>
        <!-- Small diamonds on crimson ring -->
        <polygon points="190,4 193,9 190,14 187,9"   fill="#A81D33" opacity="0.9"/>
        <polygon points="190,4 193,9 190,14 187,9"   fill="#A81D33" opacity="0.9" transform="rotate(60  190 190)"/>
        <polygon points="190,4 193,9 190,14 187,9"   fill="#A81D33" opacity="0.9" transform="rotate(120 190 190)"/>
        <polygon points="190,4 193,9 190,14 187,9"   fill="#A81D33" opacity="0.9" transform="rotate(180 190 190)"/>
        <polygon points="190,4 193,9 190,14 187,9"   fill="#A81D33" opacity="0.9" transform="rotate(240 190 190)"/>
        <polygon points="190,4 193,9 190,14 187,9"   fill="#A81D33" opacity="0.9" transform="rotate(300 190 190)"/>
      </svg>

      <!-- Inner violet ring -->
      <svg class="ring-inner" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="150" cy="150" r="146" stroke="#3D2070" stroke-width="0.5" stroke-dasharray="2 8"/>
      </svg>

      <!-- Arc text -->
      <svg class="arc-text" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <path id="arc-a" d="M30,260 A230,230 0 0,1 490,260"/>
          <path id="arc-b" d="M490,260 A230,230 0 0,1 30,260"/>
        </defs>
        <text font-family="Cinzel,serif" font-size="10" fill="#E8D5A3" letter-spacing="7">
          <textPath href="#arc-a" startOffset="8%">STEAL · KILL · PLUNDER · RULE THE DARK</textPath>
        </text>
        <text font-family="Cinzel,serif" font-size="10" fill="#7A1525" letter-spacing="5">
          <textPath href="#arc-b" startOffset="8%">EYES OF THE WEAK SHALL NEVER SEE THE THRONE</textPath>
        </text>
      </svg>

      <!-- ══════════════════════════════════════════
           SPIDER — detailed, luxurious
           Body uses gold-tipped crimson palette
           ══════════════════════════════════════════ -->
      <svg class="spider-svg" viewBox="0 0 260 290" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- ── LEGS LEFT (jointed, two-segment each) ── -->
        <!-- L1: upper-front — rises sharply -->
        <path d="M98 108 C84 96 68 82 46 66" stroke="#B0A080" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M46 66 C36 58 26 54 14 52"  stroke="#8A7860" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <!-- L2: front-mid -->
        <path d="M96 120 C78 114 56 112 32 110" stroke="#B0A080" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M32 110 C20 110 10 112 2 116"  stroke="#8A7860" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <!-- L3: rear-mid -->
        <path d="M96 140 C78 142 56 148 32 154" stroke="#B0A080" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M32 154 C20 158 10 164 2 172"  stroke="#8A7860" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <!-- L4: rear — sweeps back and down -->
        <path d="M98 154 C84 164 68 178 52 196" stroke="#B0A080" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M52 196 C44 206 38 218 34 232" stroke="#8A7860" stroke-width="1.6" stroke-linecap="round" fill="none"/>

        <!-- ── LEGS RIGHT (mirrored) ── -->
        <!-- R1 -->
        <path d="M162 108 C176 96 192 82 214 66" stroke="#B0A080" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M214 66 C224 58 234 54 246 52"  stroke="#8A7860" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        <!-- R2 -->
        <path d="M164 120 C182 114 204 112 228 110" stroke="#B0A080" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M228 110 C240 110 250 112 258 116"  stroke="#8A7860" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <!-- R3 -->
        <path d="M164 140 C182 142 204 148 228 154" stroke="#B0A080" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M228 154 C240 158 250 164 258 172"  stroke="#8A7860" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <!-- R4 -->
        <path d="M162 154 C176 164 192 178 208 196" stroke="#B0A080" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M208 196 C216 206 222 218 226 232" stroke="#8A7860" stroke-width="1.6" stroke-linecap="round" fill="none"/>

        <!-- ── LEG JOINTS (small gold dots) ── -->
        <circle cx="46"  cy="66"  r="2" fill="#C9A84C" opacity="0.6"/>
        <circle cx="32"  cy="110" r="2" fill="#C9A84C" opacity="0.6"/>
        <circle cx="32"  cy="154" r="2" fill="#C9A84C" opacity="0.6"/>
        <circle cx="52"  cy="196" r="2" fill="#C9A84C" opacity="0.6"/>
        <circle cx="214" cy="66"  r="2" fill="#C9A84C" opacity="0.6"/>
        <circle cx="228" cy="110" r="2" fill="#C9A84C" opacity="0.6"/>
        <circle cx="228" cy="154" r="2" fill="#C9A84C" opacity="0.6"/>
        <circle cx="208" cy="196" r="2" fill="#C9A84C" opacity="0.6"/>

        <!-- ── ABDOMEN ── -->
        <!-- outer shadow ellipse -->
        <ellipse cx="130" cy="182" rx="40" ry="52" fill="#3D0A14" opacity="0.7"/>
        <!-- main abdomen -->
        <ellipse cx="130" cy="178" rx="36" ry="48" fill="#6B1020"/>
        <!-- rich mid-tone layer -->
        <ellipse cx="130" cy="170" rx="28" ry="36" fill="#8B1525"/>
        <!-- highlight sheen top -->
        <ellipse cx="122" cy="154" rx="12" ry="9" fill="#C0253F" opacity="0.22"/>
        <!-- fine gold seam line -->
        <path d="M130 134 Q128 156 130 222" stroke="#C9A84C" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.25"/>

        <!-- ── WAIST (pedicel) ── -->
        <ellipse cx="130" cy="130" rx="10" ry="7" fill="#4A0E18"/>

        <!-- ── CEPHALOTHORAX ── -->
        <!-- shadow base -->
        <ellipse cx="130" cy="108" rx="38" ry="32" fill="#2A0810" opacity="0.6"/>
        <!-- main -->
        <ellipse cx="130" cy="106" rx="34" ry="30" fill="#7A1020"/>
        <!-- raised center -->
        <ellipse cx="130" cy="104" rx="22" ry="20" fill="#9A1828"/>
        <!-- central fovea groove -->
        <path d="M130 82 Q128 96 130 124" stroke="#4A0A14" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
        <!-- gold rim highlight -->
        <ellipse cx="130" cy="106" rx="34" ry="30" stroke="#C9A84C" stroke-width="0.5" fill="none" opacity="0.18"/>

        <!-- ── HEAD ── -->
        <!-- shadow -->
        <ellipse cx="130" cy="80"  rx="25" ry="22" fill="#1E0608" opacity="0.5"/>
        <!-- main head -->
        <ellipse cx="130" cy="78"  rx="22" ry="20" fill="#A81D33"/>
        <!-- gold crown rim -->
        <ellipse cx="130" cy="78"  rx="22" ry="20" stroke="#C9A84C" stroke-width="0.7" fill="none" opacity="0.30"/>

        <!-- ── EYES — 8 (two rows of 4) ── -->
        <!-- front row: the two large principal eyes center -->
        <circle cx="122" cy="71" r="4.5" fill="#050508"/>
        <circle cx="138" cy="71" r="4.5" fill="#050508"/>
        <!-- front row outer -->
        <circle cx="113" cy="75" r="3"   fill="#050508"/>
        <circle cx="147" cy="75" r="3"   fill="#050508"/>
        <!-- posterior row, smaller -->
        <circle cx="116" cy="82" r="2.5" fill="#050508" opacity="0.85"/>
        <circle cx="126" cy="80" r="2"   fill="#050508" opacity="0.85"/>
        <circle cx="134" cy="80" r="2"   fill="#050508" opacity="0.85"/>
        <circle cx="144" cy="82" r="2.5" fill="#050508" opacity="0.85"/>
        <!-- eye-shine: gold glint on principal eyes -->
        <circle cx="120" cy="69" r="1.2" fill="#C9A84C" opacity="0.55"/>
        <circle cx="136" cy="69" r="1.2" fill="#C9A84C" opacity="0.55"/>

        <!-- ── CHELICERAE ── -->
        <path d="M118 94 C112 102 108 110 110 116" stroke="#C8C8D4" stroke-width="2"   stroke-linecap="round" fill="none"/>
        <path d="M142 94 C148 102 152 110 150 116" stroke="#C8C8D4" stroke-width="2"   stroke-linecap="round" fill="none"/>
        <!-- fang curve -->
        <path d="M110 116 C109 120 112 123 114 120" stroke="#C8C8D4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M150 116 C151 120 148 123 146 120" stroke="#C8C8D4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <!-- venom tips gold -->
        <circle cx="113" cy="120" r="2" fill="#C9A84C" opacity="0.7"/>
        <circle cx="147" cy="120" r="2" fill="#C9A84C" opacity="0.7"/>

        <!-- ── PEDIPALPS ── -->
        <path d="M114 86 C104 82 96 78 88 72" stroke="#8A7050" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <path d="M146 86 C156 82 164 78 172 72" stroke="#8A7050" stroke-width="1.5" stroke-linecap="round" fill="none"/>

        <!-- ── SPINNERETS ── -->
        <ellipse cx="130" cy="226" rx="8" ry="5.5" fill="#3D0A14"/>
        <ellipse cx="126" cy="227" rx="3" ry="4"   fill="#5A1020" opacity="0.8"/>
        <ellipse cx="134" cy="227" rx="3" ry="4"   fill="#5A1020" opacity="0.8"/>

        <!-- ── SILK THREAD ── -->
        <line x1="130" y1="231" x2="130" y2="252" stroke="#C9A84C" stroke-width="0.7" opacity="0.18"/>
        <line x1="128" y1="240" x2="132" y2="246" stroke="#C9A84C" stroke-width="0.4" opacity="0.12"/>
      </svg>

    </div>
  </div>

  <!-- FOOTER ORNAMENT -->
  <div class="footer">
    <div class="footer-ornament">
      <div class="footer-rule rev"></div>
      <div class="footer-diamond"></div>
      <div class="footer-rule"></div>
    </div>
  </div>

</div>
</body>
</html>
